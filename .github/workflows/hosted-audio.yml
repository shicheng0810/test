name: Publish hosted audio
on:
  push:
    paths:
      - '.github/workflows/hosted-audio.yml'
      - 'scripts/build_audio.py'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hosted-audio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate pronunciation files
        run: python3 scripts/build_audio.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy audio and website
        id: deployment
        uses: actions/deploy-pages@v4
